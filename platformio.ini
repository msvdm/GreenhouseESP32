; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
; Pinned deliberately. This board drives a 2200W element and has no USB port,
; so a silent platform bump changing the Arduino core (7.x = core 3.x, which
; moves esp_task_wdt_init and the WebServer API) must never reach it by
; surprise. Upgrade explicitly, build, and verify over serial first.
platform = espressif32@6.12.0
board = esp32dev
framework = arduino

; Serial monitor speed
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

; Required libraries
lib_deps = 
    milesburton/DallasTemperature@^3.11.0
    paulstoffregen/OneWire@^2.3.7
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit ST7735 and ST7789 Library@^1.10.3
    adafruit/Adafruit BusIO@^1.16.1
    bblanchon/ArduinoJson@^6.21.3


; --- Over-the-air upload ----------------------------------------------------
; The production board has no USB. After the first serial flash, upload with:
;   pio run -e ota -t upload
; Falls back to the browser at http://192.168.4.1/update if espota fails.
[env:ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = 192.168.4.1
; Read from the environment so no credential is ever committed. Set it first:
;   PowerShell  $env:GREENHOUSE_OTA_PASS = "..."
;   bash        export GREENHOUSE_OTA_PASS="..."
upload_flags =
    --auth=${sysenv.GREENHOUSE_OTA_PASS}
