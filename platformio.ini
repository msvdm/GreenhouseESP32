; Greenhouse controller - ESP32-WROOM-32E 2-channel relay board
;
; Platform pinned on purpose: 7.x moves to Arduino core 3.x (different
; esp_task_wdt / WebServer APIs). This board has no USB port, so upgrade only
; deliberately.

[env:esp32dev]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

lib_deps =
    milesburton/DallasTemperature@^3.11.0
    paulstoffregen/OneWire@^2.3.7
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit ST7735 and ST7789 Library@^1.10.3
    adafruit/Adafruit BusIO@^1.16.1

; Over-the-air upload with espota:
;   PowerShell:  $env:GREENHOUSE_OTA_PASS = "..."; pio run -e ota -t upload
; Or upload .pio/build/esp32dev/firmware.bin from the web UI (/update).
[env:ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = 192.168.0.102
upload_flags =
    --auth=${sysenv.GREENHOUSE_OTA_PASS}
